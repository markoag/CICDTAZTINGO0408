# =====================================================================================
# CI/CD Pipeline - Proyecto Final Ing. de Datos con Databricks
# Arquitectura Medallion (Bronze / Silver / Golden) con Unity Catalog + Managed Identity
# Fuentes: Ecommerce_Sales_Prediction_Dataset (Kaggle) + Instacart Market Basket Dataset
#
# Acoplado a la lógica de deploy-notebook_pruebas.yml (mismo cluster, mismo estilo de
# validación/monitoreo), pero desplegando directamente los notebooks del repo
# (carpeta ./proceso) en vez de exportarlos desde un workspace origen.
# =====================================================================================
name: CI/CD Pipeline - Databricks Medallion Proyecto Final

on:
  push:
    branches:
      - main

jobs:
  deploy-and-orchestrate:
    runs-on: ubuntu-latest

    steps:
    # -------------------------------------------------------------------------------
    # 1. Checkout del repositorio
    # -------------------------------------------------------------------------------
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install jq & Databricks CLI
      run: |
        sudo apt-get update && sudo apt-get install -y jq curl
        pip install databricks-cli

    # -------------------------------------------------------------------------------
    # 2. Desplegar notebooks de la carpeta "proceso" al workspace de Producción
    #    (Estos son los únicos notebooks que corren en Producción)
    # -------------------------------------------------------------------------------
    - name: Deploy Notebooks to Production Workspace
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}
      run: |
        DEST_BASE="/smartdata/proceso"
        databricks workspace mkdirs "$DEST_BASE"
        databricks workspace import_dir ./proceso "$DEST_BASE" --overwrite
        echo "✅ Notebooks desplegados en $DEST_BASE"

    # -------------------------------------------------------------------------------
    # 3. Verificar si ya existe el workflow y eliminarlo (evita duplicados)
    # -------------------------------------------------------------------------------
    - name: Check if workflow exists and delete if necessary
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}
      run: |
        WORKFLOW_NAME="WF_Medallion_ProyectoFinal"

        echo "Verificando si existe el workflow: $WORKFLOW_NAME"
        workflows_response=$(curl -s -X GET \
          -H "Authorization: Bearer $DATABRICKS_TOKEN" \
          "$DATABRICKS_HOST/api/2.1/jobs/list")

        existing_job_id=$(echo "$workflows_response" | jq -r --arg name "$WORKFLOW_NAME" '.jobs[]? | select(.settings.name == $name) | .job_id')

        if [ "$existing_job_id" != "" ] && [ "$existing_job_id" != "null" ]; then
          echo "Workflow encontrado con ID: $existing_job_id. Eliminando..."
          delete_response=$(curl -s -X POST \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\": $existing_job_id}" \
            "$DATABRICKS_HOST/api/2.1/jobs/delete")
          echo "Delete response: $delete_response"
        else
          echo "No se encontró workflow existente con nombre: $WORKFLOW_NAME"
        fi

    # -------------------------------------------------------------------------------
    # 4. Obtener el ID del clúster de Producción (el mismo usado en pruebas: Cluster_SD)
    #    Debe estar ENCENDIDO antes de hacer push.
    # -------------------------------------------------------------------------------
    - name: Get existing cluster ID
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}
      run: |
        CLUSTER_NAME="Cluster_SD"

        echo "Buscando cluster existente: $CLUSTER_NAME"
        clusters_response=$(curl -s -X GET \
          -H "Authorization: Bearer $DATABRICKS_TOKEN" \
          "$DATABRICKS_HOST/api/2.0/clusters/list")

        cluster_id=$(echo "$clusters_response" | jq -r --arg name "$CLUSTER_NAME" '.clusters[]? | select(.cluster_name == $name) | .cluster_id')

        if [ "$cluster_id" != "" ] && [ "$cluster_id" != "null" ]; then
          echo "✅ Cluster encontrado: $CLUSTER_NAME con ID: $cluster_id"
          echo "CLUSTER_ID=$cluster_id" >> $GITHUB_ENV
        else
          echo "❌ No se encontró el cluster: $CLUSTER_NAME. Recuerda que debe estar ENCENDIDO."
          echo "Clusters disponibles:"
          echo "$clusters_response" | jq -r '.clusters[]? | .cluster_name'
          exit 1
        fi

    # -------------------------------------------------------------------------------
    # 5. Crear el Job/Workflow con las 6 tareas encadenadas
    #    prepambiente -> (ingest_ecommerce + ingest_instacart en paralelo) -> transform -> load -> grants
    # -------------------------------------------------------------------------------
    - name: Create Databricks Workflow WF_Medallion_ProyectoFinal
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}
      run: |
        DEST_BASE="/smartdata/proceso"
        CLUSTER_ID="${{ env.CLUSTER_ID }}"
        STORAGE_ACCOUNT="adstaztingo0408"
        CATALOG="catalog_proyecto_final"

        echo "Creando workflow: WF_Medallion_ProyectoFinal con cluster existente ID: $CLUSTER_ID"

        cat > workflow_config.json << EOF
        {
          "name": "WF_Medallion_ProyectoFinal",
          "format": "MULTI_TASK",
          "tasks": [
            {
              "task_key": "prepambiente",
              "description": "Crea/verifica credencial, external locations, catalogo y esquemas del Proyecto Final",
              "notebook_task": {
                "notebook_path": "$DEST_BASE/1.Preparacion_Ambiente",
                "source": "WORKSPACE",
                "base_parameters": {
                  "storageName": "$STORAGE_ACCOUNT",
                  "catalogo": "$CATALOG"
                }
              },
              "existing_cluster_id": "$CLUSTER_ID",
              "timeout_seconds": 3600,
              "max_retries": 2
            },
            {
              "task_key": "ingest_ecommerce",
              "description": "Ingesta Ecommerce_Sales_Prediction_Dataset.csv (raw -> bronze)",
              "notebook_task": {
                "notebook_path": "$DEST_BASE/2.Ingest_Ecommerce",
                "source": "WORKSPACE",
                "base_parameters": {
                  "container": "raw",
                  "catalogo": "$CATALOG",
                  "esquema": "bronze",
                  "storageName": "$STORAGE_ACCOUNT"
                }
              },
              "existing_cluster_id": "$CLUSTER_ID",
              "timeout_seconds": 3600,
              "max_retries": 2,
              "depends_on": [ { "task_key": "prepambiente" } ]
            },
            {
              "task_key": "ingest_instacart",
              "description": "Ingesta aisles, departments, orders, products, order_products__prior, order_products__train (raw -> bronze)",
              "notebook_task": {
                "notebook_path": "$DEST_BASE/2.Ingest_Instacart",
                "source": "WORKSPACE",
                "base_parameters": {
                  "container": "raw",
                  "catalogo": "$CATALOG",
                  "esquema": "bronze",
                  "storageName": "$STORAGE_ACCOUNT"
                }
              },
              "existing_cluster_id": "$CLUSTER_ID",
              "timeout_seconds": 3600,
              "max_retries": 2,
              "depends_on": [ { "task_key": "prepambiente" } ]
            },
            {
              "task_key": "transform",
              "description": "Limpieza, casteo, deduplicacion y joins (bronze -> silver)",
              "notebook_task": {
                "notebook_path": "$DEST_BASE/3.Transform",
                "source": "WORKSPACE",
                "base_parameters": {
                  "catalogo": "$CATALOG",
                  "esquema_source": "bronze",
                  "esquema_sink": "silver"
                }
              },
              "existing_cluster_id": "$CLUSTER_ID",
              "timeout_seconds": 3600,
              "max_retries": 2,
              "depends_on": [
                { "task_key": "ingest_ecommerce" },
                { "task_key": "ingest_instacart" }
              ]
            },
            {
              "task_key": "load",
              "description": "Agregaciones y KPIs de negocio (silver -> golden)",
              "notebook_task": {
                "notebook_path": "$DEST_BASE/4.Load",
                "source": "WORKSPACE",
                "base_parameters": {
                  "catalogo": "$CATALOG",
                  "esquema_source": "silver",
                  "esquema_sink": "golden"
                }
              },
              "existing_cluster_id": "$CLUSTER_ID",
              "timeout_seconds": 3600,
              "max_retries": 2,
              "depends_on": [ { "task_key": "transform" } ]
            },
            {
              "task_key": "grants",
              "description": "Aplica privilegios RBAC sobre catalogo/esquemas",
              "notebook_task": {
                "notebook_path": "$DEST_BASE/5.Grants_Medallion",
                "source": "WORKSPACE"
              },
              "existing_cluster_id": "$CLUSTER_ID",
              "timeout_seconds": 3600,
              "max_retries": 2,
              "depends_on": [ { "task_key": "load" } ]
            }
          ],
          "schedule": {
            "quartz_cron_expression": "0 0 8 * * ?",
            "timezone_id": "America/Guayaquil",
            "pause_status": "PAUSED"
          },
          "email_notifications": { "on_failure": [], "on_success": [], "no_alert_for_skipped_runs": false },
          "webhook_notifications": {},
          "timeout_seconds": 7200,
          "max_concurrent_runs": 1,
          "tags": {
            "environment": "production",
            "created_by": "github_actions",
            "project": "proyecto_final_databricks",
            "cluster_used": "Cluster_SD"
          }
        }
        EOF

        create_response=$(curl -s -X POST \
          -H "Authorization: Bearer $DATABRICKS_TOKEN" \
          -H "Content-Type: application/json" \
          -d @workflow_config.json \
          "$DATABRICKS_HOST/api/2.1/jobs/create")

        echo "Workflow creation response: $create_response"
        job_id=$(echo "$create_response" | jq -r '.job_id')

        if [ "$job_id" != "" ] && [ "$job_id" != "null" ]; then
          echo "✅ Workflow creado exitosamente con ID: $job_id"
          echo "JOB_ID=$job_id" >> $GITHUB_ENV

          workflow_details=$(curl -s -X GET \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$DATABRICKS_HOST/api/2.1/jobs/get?job_id=$job_id")
          echo "Detalles del workflow:"
          echo "$workflow_details" | jq '.settings | {name, tasks: (.tasks | map({task_key, notebook_task: .notebook_task.notebook_path}))}'
        else
          echo "❌ Error al crear el workflow"
          echo "Response completo: $create_response"
          exit 1
        fi

    # -------------------------------------------------------------------------------
    # 6. Validar la configuración del workflow recién creado
    # -------------------------------------------------------------------------------
    - name: Validate Workflow Configuration
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}
      run: |
        JOB_ID="${{ env.JOB_ID }}"

        echo "🔍 Validando la configuración del workflow creado..."
        job_details=$(curl -s -X GET \
          -H "Authorization: Bearer $DATABRICKS_TOKEN" \
          "$DATABRICKS_HOST/api/2.1/jobs/get?job_id=$JOB_ID")

        echo "📋 Resumen del workflow:"
        echo "Nombre: $(echo "$job_details" | jq -r '.settings.name')"
        echo "Número de tareas: $(echo "$job_details" | jq '.settings.tasks | length')"
        echo ""
        echo "📝 Tareas configuradas:"
        echo "$job_details" | jq -r '.settings.tasks[] | "- " + .task_key + " → " + .notebook_task.notebook_path'
        echo ""
        echo "🖥️  Cluster ID: $(echo "$job_details" | jq -r '.settings.tasks[0].existing_cluster_id')"
        echo "🖥️  Cluster Name: Cluster_SD (reutilizado)"

    # -------------------------------------------------------------------------------
    # 7. Ejecutar el workflow recién creado
    # -------------------------------------------------------------------------------
    - name: Execute Workflow
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}
      run: |
        JOB_ID="${{ env.JOB_ID }}"
        run_response=$(curl -s -X POST \
          -H "Authorization: Bearer $DATABRICKS_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"job_id\": $JOB_ID}" \
          "$DATABRICKS_HOST/api/2.1/jobs/run-now")

        run_id=$(echo "$run_response" | jq -r '.run_id')

        if [ "$run_id" != "" ] && [ "$run_id" != "null" ]; then
          echo "🎯 Workflow ejecutado. Run ID: $run_id"
          echo "RUN_ID=$run_id" >> $GITHUB_ENV
          echo "🔗 URL: $DATABRICKS_HOST/jobs/$JOB_ID/runs/$run_id"
        else
          echo "❌ Error al ejecutar el workflow: $run_response"
          exit 1
        fi

    # -------------------------------------------------------------------------------
    # 8. Monitorear la ejecución hasta que finalice (máx. 10 minutos)
    # -------------------------------------------------------------------------------
    - name: Monitor Workflow Execution
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}
      run: |
        RUN_ID="${{ env.RUN_ID }}"
        max_wait_time=600
        wait_time=0
        check_interval=30

        while [ $wait_time -lt $max_wait_time ]; do
          run_status=$(curl -s -X GET \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$DATABRICKS_HOST/api/2.1/jobs/runs/get?run_id=$RUN_ID")

          state=$(echo "$run_status" | jq -r '.state.life_cycle_state')
          result_state=$(echo "$run_status" | jq -r '.state.result_state // "RUNNING"')
          echo "⏱️  Estado: $state ($result_state) - ${wait_time}s transcurridos"
          echo "$run_status" | jq -r '.tasks[]? | "  📋 " + .task_key + ": " + .state.life_cycle_state + " (" + (.state.result_state // "RUNNING") + ")"'

          if [ "$state" = "TERMINATED" ]; then
            if [ "$result_state" = "SUCCESS" ]; then
              echo "🎉 ¡Workflow completado exitosamente!"
              start_time=$(echo "$run_status" | jq -r '.start_time')
              end_time=$(echo "$run_status" | jq -r '.end_time')
              if [ "$start_time" != "null" ] && [ "$end_time" != "null" ]; then
                duration=$((($end_time - $start_time) / 1000))
                echo "⏰ Duración total: ${duration} segundos"
              fi
              exit 0
            else
              echo "❌ Workflow terminó con errores: $result_state"
              echo "$run_status" | jq -r '.tasks[]? | "❌ " + .task_key + ": " + (.state.result_state // "UNKNOWN")'
              exit 1
            fi
          elif [ "$state" = "INTERNAL_ERROR" ] || [ "$state" = "SKIPPED" ]; then
            echo "❌ Workflow falló con estado: $state"
            exit 1
          fi

          sleep $check_interval
          wait_time=$((wait_time + check_interval))
        done

        echo "⚠️  Timeout de monitoreo alcanzado. Verifica manualmente en Databricks."
        echo "🔗 $DATABRICKS_HOST/jobs/$JOB_ID/runs/$RUN_ID"
        exit 0

    # -------------------------------------------------------------------------------
    # 9. Limpieza de archivos temporales
    # -------------------------------------------------------------------------------
    - name: Clean up
      if: always()
      run: |
        rm -f workflow_config.json

    - name: Done
      if: success()
      run: |
        echo "🎉 ¡Despliegue y ejecución completados exitosamente!"
        echo ""
        echo "📊 Resumen:"
        echo "✅ Notebooks desplegados en /smartdata/proceso"
        echo "✅ Workflow creado: WF_Medallion_ProyectoFinal"
        echo "✅ Tareas: prepambiente -> (ingest_ecommerce + ingest_instacart) -> transform -> load -> grants"
        echo "✅ Cluster reutilizado: Cluster_SD"
        echo "✅ Storage account: adstaztingo0408"
        echo ""
        echo "🔗 Accede a tu workspace de Databricks para ver los resultados detallados"
